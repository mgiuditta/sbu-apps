name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - &checkout
        uses: actions/checkout@v4

      - &xcode
        name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version

      - &simulator
        name: Pick a simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          print(next(d["udid"] for d in reversed(devices) if d["name"].startswith("iPhone")))')
          echo "DESTINATION=id=$id" >> "$GITHUB_ENV"

      - name: Tokens match Design/tokens.json
        run: python3 Tools/sync_tokens.py && git diff --exit-code

      - name: SbuKit
        working-directory: Packages/SbuKit
        run: xcodebuild test -scheme SbuKit -destination "$DESTINATION"

  # Every Apps/Sbu* folder, so a new app is tested without touching this file.
  list:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - *checkout
      - id: apps
        run: echo "apps=$(ls -d Apps/Sbu* | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  app:
    needs: list
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.list.outputs.apps) }}
    name: ${{ matrix.app }}
    defaults:
      run:
        working-directory: Apps/${{ matrix.app }}
    steps:
      - *checkout
      - *xcode
      - *simulator
      - name: Test
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild test -project ${{ matrix.app }}.xcodeproj -scheme ${{ matrix.app }} -destination "$DESTINATION"
