name: Site

on:
  push:
    branches: [main]
    paths: [Site/**, Design/**, Apps/*/fastlane/metadata/**, Tools/sync_tokens.py, .github/workflows/site.yml]
  pull_request:
    paths: [Site/**, Design/**, Apps/*/fastlane/metadata/**, Tools/sync_tokens.py, .github/workflows/site.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tokens match Design/tokens.json
        run: python3 Tools/sync_tokens.py && git diff --exit-code

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Build
        working-directory: Site
        run: npm ci && npm run build
