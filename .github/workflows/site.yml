name: Site

on:
  push:
    branches: [main]
    paths: [Site/**, Design/**, Apps/*/fastlane/metadata/**, Tools/sync_tokens.py, .github/workflows/site.yml]
  pull_request:
    paths: [Site/**, Design/**, Apps/*/fastlane/metadata/**, Tools/sync_tokens.py, .github/workflows/site.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tokens match Design/tokens.json
        run: python3 Tools/sync_tokens.py && git diff --exit-code

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Build
        working-directory: Site
        run: npm ci && npm run build

      # Deploy only from main and only when both secrets exist. None are configured yet.
      # Secrets stay out of the npm steps: only these two steps see them.
      - name: Cloudflare secrets present
        id: cloudflare
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "ready=$([[ -n $TOKEN && -n $ACCOUNT ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy Site/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sbu-dev' }} --branch=main
