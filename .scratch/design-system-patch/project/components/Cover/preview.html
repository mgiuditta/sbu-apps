<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); font-family: var(--font-sans); color: var(--ink); position: relative; width: 960px; height: 288px; overflow: hidden; }
  .name { position: absolute; left: 48px; bottom: 56px; font-family: var(--font-display); font-size: 120px; line-height: .92; font-weight: 700; letter-spacing: -5px; color: var(--ink); margin: 0; }
  .tag { position: absolute; left: 50px; bottom: 32px; font-size: 14px; line-height: 18px; color: var(--ink-muted); margin: 0; max-width: 440px; }
  svg { position: absolute; left: 480px; top: 0; }
  .brand { fill: var(--brand); }
  .level { fill: var(--accent-level); }
  .habits { fill: var(--accent-habits); }
  .cards { fill: var(--accent-cards); }
  .docs { fill: var(--accent-docs); }
  .ink { fill: var(--ink); }
  .ring { fill: none; stroke: var(--on-accent); stroke-width: 9; }
  .dot { fill: var(--on-accent); }
</style>
<!--
  blocks: brand 192×192, accent-habits 96×192, accent-level 96×96, accent-cards 96×96, accent-docs 96×96, ink 96×96 — sides are space-12 (48) ×2 and ×4, corners radius-icon (22.5% of side: 43 and 21.6)
  arrangement: a flush modular grid of app-icon tiles bleeding off the top and right edge, the brand tile largest — the family of icons seen as one wall
  pattern: the literal motif of the mark — one ring and one dot (icon-stroke scaled) — cut in on-accent into three tiles; "a literal motif → that silhouette built from radii"
  scales: tile pitch 96 = space-12×2, gap 0 (flush), ring stroke 9 ≈ icon-stroke/1024 × 96, ring r 30
-->
<svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
  <rect class="brand" x="0" y="-48" width="192" height="192" rx="43"/>
  <circle class="ring" cx="96" cy="48" r="30"/>
  <circle class="dot" cx="96" cy="48" r="9"/>
  <rect class="habits" x="192" y="-48" width="96" height="192" rx="21.6"/>
  <rect class="level" x="288" y="-48" width="96" height="96" rx="21.6"/>
  <rect class="cards" x="384" y="-48" width="144" height="96" rx="21.6"/>
  <rect class="docs" x="288" y="48" width="96" height="96" rx="21.6"/>
  <circle class="ring" cx="336" cy="96" r="30"/>
  <rect class="ink" x="384" y="48" width="144" height="96" rx="21.6"/>
  <rect class="level" x="0" y="144" width="96" height="96" rx="21.6"/>
  <rect class="cards" x="96" y="144" width="96" height="96" rx="21.6"/>
  <circle class="dot" cx="144" cy="192" r="9"/>
  <rect class="brand" x="192" y="144" width="192" height="192" rx="43"/>
  <circle class="ring" cx="288" cy="240" r="30"/>
  <rect class="habits" x="384" y="144" width="144" height="192" rx="43"/>
</svg>
