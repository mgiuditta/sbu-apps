<style>
  body { margin: 0; padding: 20px; background: var(--surface); font-family: var(--font-sans); color: var(--ink); }
  .group { max-width: 380px; background: var(--surface-raised); border-radius: var(--radius-lg); overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; }
  .row + .row { border-top: var(--hairline) solid var(--line); }
  .ic { width: 40px; height: 40px; border-radius: var(--radius-md); display: grid; place-items: center; color: var(--on-accent); font-weight: 700; font-size: 15px; }
  .t { font-size: 17px; line-height: 22px; font-weight: 600; }
  .s { font-size: 15px; line-height: 20px; color: var(--ink-muted); }
  .amt { font-family: var(--font-mono); font-size: 22px; line-height: 28px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
  .when { font-size: 13px; line-height: 18px; text-align: right; }
  .warn { color: var(--warning); } .ok { color: var(--success); } .muted { color: var(--ink-muted); }
  .cap { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-muted); margin: 0 16px 8px; }
</style>

  <div class="row">

    <div><div class="t">iCloud+ 200 GB</div><div class="s">Cloud · mensile</div></div>
    <div><div class="amt">2,99</div><div class="when muted">14 nov</div></div>
  </div>
  <div class="row">
    <div class="ic" style="background: var(--accent-habits)">S</div>
    <div><div class="t">Spotify</div><div class="s">Musica · annuale</div></div>
