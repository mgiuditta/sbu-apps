<!-- @dsCard group="Screens" height=420 subtitle="Schermata strumento: campo pieno, cifra-eroe, pill, ingranaggio in alto. Sempre scura, niente tab bar." -->
<style>
  body { margin: 0; padding: 20px; background: var(--surface); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 20px; flex-wrap: wrap; }
  .phone { width: 200px; height: 380px; border-radius: 28px; overflow: hidden; position: relative; display: flex; flex-direction: column; color: var(--on-field); }
  .level { background: var(--field-level); }
  .noise { background: var(--field-noise); }
  .habits { background: var(--field-habits); }
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 16px 0; color: var(--on-field); }
  .top b { grid-column: 2; font-weight: 600; font-size: 13px; }
  .top svg { position: static; grid-column: 3; justify-self: end; }
  .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; }
  .cap { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: .4px; text-transform: uppercase; color: var(--on-field-muted); }
  .hero { font-family: var(--font-mono); font-size: 56px; line-height: 60px; font-weight: 500; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .hero .u { font-size: 22px; color: var(--on-field-muted); letter-spacing: 0; margin-left: 2px; }
  .sub { font-size: 12px; color: var(--on-field-muted); }
  .pills { display: flex; gap: 5px; padding: 0 12px; justify-content: center; flex-wrap: nowrap; flex-shrink: 0; }
  .pill { background: var(--field-control); border-radius: 999px; padding: 5px 10px; font-size: 11px; line-height: 16px; white-space: nowrap; }
  .pill.on { background: var(--field-control-active); font-weight: 600; }
  .pills { margin-bottom: 32px; }
  svg { position: absolute; left: 0; right: 0; }
</style>
