name: SbuChats
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuChats:
    type: application
    platform: iOS
    sources: [SbuChats]
    dependencies:
      - package: SbuKit
    info:
      path: SbuChats/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Exported chats arrive from the share sheet ("Copy to Sbu Chats") as .zip or .txt.
        # Alternate: Sbu Chats offers to open them, never claims every ZIP or text file.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Chat (.zip)
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive, com.pkware.zip-archive]
          - CFBundleTypeName: Chat (.txt)
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.utf8-plain-text]
        # A copy arrives in Documents/Inbox; the app reads it and deletes it.
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.chats
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Chats
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Inversa
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuChatsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuChatsTests]
    dependencies:
      - target: SbuChats
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuChatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuChatsUITests]
    dependencies:
      - target: SbuChats
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuChats:
    build:
      targets:
        SbuChats: all
    test:
      targets: [SbuChatsTests]
  SbuChatsSnapshots:
    build:
      targets:
        SbuChats: all
    test:
      targets: [SbuChatsUITests]
