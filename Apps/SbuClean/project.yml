name: SbuClean
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuClean:
    type: application
    platform: iOS
    sources: [SbuClean]
    dependencies:
      - package: SbuKit
      - target: SbuCleanWidget
    entitlements:
      path: SbuClean/SbuClean.entitlements
      properties:
        # Shared with the widget: the space you can free from the last scan.
        com.apple.security.application-groups: [group.dev.sbu.clean]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.clean
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Clean
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Italian source; the English one is in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Sbu Clean guarda le tue foto e i tuoi video per trovare doppioni, screenshot e file pesanti. Tutto resta su questo iPhone: niente lascia il dispositivo."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuCleanWidget:
    type: app-extension
    platform: iOS
    sources:
      - SbuCleanWidget
      # The widget shares the figure, the storage reading and the snapshot with the app.
      - SbuClean/Clean/SpaceFigure.swift
      - SbuClean/Clean/DeviceStorage.swift
      - SbuClean/Clean/WidgetSnapshot.swift
      - SbuClean/Store/StoredFile.swift
      - SbuClean/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuCleanWidget/SbuCleanWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sbu.clean]
    info:
      path: SbuCleanWidget/Info.plist
      properties:
        CFBundleDisplayName: Sbu Clean
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.clean.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuCleanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuCleanTests]
    dependencies:
      - target: SbuClean
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuCleanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuCleanUITests]
    dependencies:
      - target: SbuClean
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuClean:
    build:
      targets:
        SbuClean: all
    test:
      targets:
        - SbuCleanTests
        - name: SbuCleanUITests
          skippedTests: [SnapshotTests]
  SbuCleanSnapshots:
    build:
      targets:
        SbuClean: all
    test:
      targets: [SbuCleanUITests]
