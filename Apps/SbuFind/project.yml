name: SbuFind
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuFind:
    type: application
    platform: iOS
    sources: [SbuFind]
    dependencies:
      - package: SbuKit
      - target: SbuFindWidget
    info:
      path: SbuFind/Info.plist
      properties:
        # Only to listen in the background for your saved devices that advertise services, for
        # Avvisami se lo perdi and the last place; iOS relaunches the app for them.
        UIBackgroundModes: [bluetooth-central]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.find
        GENERATE_INFOPLIST_FILE: YES
        # The search on the Lock Screen and in the Dynamic Island.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Find
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The scan only listens to nearby devices; nothing is sent. English in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Sbu Find ascolta i dispositivi Bluetooth vicini per aiutarti a ritrovarli, anche con l'app chiusa per i tuoi dispositivi salvati. Quello che sente resta sull'iPhone: non viene mai inviato."
        # Only when Ricorda dove li hai sentiti is on; the places stay on the iPhone. English in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Sbu Find ricorda dov'era il tuo iPhone quando ha sentito un dispositivo l'ultima volta, per mostrartelo sulla mappa. Le posizioni restano sull'iPhone."
        # Asked only when you turn on Anche con l'app chiusa for the last place. English in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Con l'app chiusa, Sbu Find legge la posizione solo quando sente uno dei tuoi dispositivi, per ricordare dove l'hai lasciato. Le posizioni restano sull'iPhone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuFindWidget:
    type: app-extension
    platform: iOS
    sources:
      - SbuFindWidget
      # The Live Activity shares its attributes, the scale, the words and the ring with the app.
      - SbuFind/Activity/SearchActivityAttributes.swift
      - SbuFind/Signal/Proximity.swift
      - SbuFind/Signal/SignalTuning.swift
      - SbuFind/Signal/Warmth.swift
      - SbuFind/Signal/RingFill.swift
      - SbuFind/Views/SignalRing.swift
      - SbuFind/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    info:
      path: SbuFindWidget/Info.plist
      properties:
        CFBundleDisplayName: Sbu Find
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.find.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuFindTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuFindTests]
    dependencies:
      - target: SbuFind
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuFindUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuFindUITests]
    dependencies:
      - target: SbuFind
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuFind:
    build:
      targets:
        SbuFind: all
    test:
      targets: [SbuFindTests]
  SbuFindSnapshots:
    build:
      targets:
        SbuFind: all
    test:
      targets: [SbuFindUITests]
