name: SbuGrid
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuGrid:
    type: application
    platform: iOS
    sources: [SbuGrid]
    dependencies:
      - package: SbuKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.grid
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Grid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Saving the gridded photo only adds to Photos; the picker needs no permission. English in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Sbu Grid aggiunge a Foto solo la foto con la griglia che salvi. Non legge la tua libreria."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuGridTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuGridTests]
    dependencies:
      - target: SbuGrid
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuGridUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuGridUITests]
    dependencies:
      - target: SbuGrid
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuGrid:
    build:
      targets:
        SbuGrid: all
    test:
      targets: [SbuGridTests]
  SbuGridSnapshots:
    build:
      targets:
        SbuGrid: all
    test:
      targets: [SbuGridUITests]
