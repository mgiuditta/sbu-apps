name: SbuHabits
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuHabits:
    type: application
    platform: iOS
    sources: [SbuHabits]
    dependencies:
      - package: SbuKit
      - target: SbuHabitsWidget
      # The Apple Watch app, in the iPhone app's Watch folder.
      - target: SbuHabitsWatch
    entitlements:
      path: SbuHabits/SbuHabits.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sbu.habits]
        # Read only, for habits linked to Salute; no clinical records.
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Wakes the app to mark linked habits; only while a habit is linked.
        com.apple.developer.healthkit.background-delivery: true
        # Sensibili al tempo, and the end of a countdown: through a Focus that allows them.
        com.apple.developer.usernotifications.time-sensitive: true
        # Sincronizza con iCloud, off by default: the habits file in the user's own iCloud
        # container, outside Documents so it stays hidden (ADR-0008). App only, not the widget.
        com.apple.developer.icloud-container-identifiers: [iCloud.dev.sbu.habits]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.dev.sbu.habits]
        # Abitudini condivise (ADR-0009): the same container's CloudKit, one zone per shared habit
        # in the owner's private database, read by the people invited from their shared database.
        com.apple.developer.icloud-services: [CloudDocuments, CloudKit]
        # The silent notification iCloud sends when a shared habit changes; no server of ours.
        aps-environment: development
    info:
      path: SbuHabits/Info.plist
      properties:
        # The version and build from the project settings, as without a plist of our own.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Opens the app from an invitation to an Abitudine condivisa.
        CKSharingSupported: true
        # Wakes the app for iCloud's silent notification, to refresh the Abitudini condivise.
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.habits
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Habits
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Italian source; the English one is in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Sbu Habits legge da Salute solo le misure che colleghi, per segnare le tue abitudini. I dati di Salute restano su questo iPhone."
        # Required with HealthKit even though Sbu Habits never writes to Salute.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Sbu Habits non scrive niente in Salute. Legge solo le misure che colleghi, e i dati di Salute restano su questo iPhone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # The running countdown on the Lock Screen and in the Dynamic Island.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuHabitsWidget:
    type: app-extension
    platform: iOS
    sources:
      - SbuHabitsWidget
      # The widget shares the habits' types, the reminder plan, the ring and the intent with the app.
      - path: SbuHabits/Habits
        excludes: [HabitsModel.swift, HomePages.swift, HabitsModel+Preview.swift, HabitSymbol.swift, HabitSymbol+Catalog.swift, HabitSymbolCategory.swift, SymbolSearch.swift, HabitsExport.swift, HabitsImport.swift, HabitsImport+Failure.swift, HabitsImport+Preview.swift]
      - SbuHabits/Reminders
      - SbuHabits/Timer
      - SbuHabits/Intents
      - SbuHabits/Views/HabitRing.swift
      - SbuHabits/Views/HabitRingFace.swift
      - SbuHabits/Views/HabitsWidgetGrid.swift
      # The Live Activity's Pausa and Riprendi, as the Timer draws them.
      - SbuHabits/Views/RoundButtonStyle.swift
      - SbuHabits/Views/SlotCaption.swift
      # The one-habit widgets: the ring, the Serie, the line, the weekday bars and the calendar.
      - SbuHabits/Views/Widgets
      - path: SbuHabits/Statistics
        excludes: [StatisticsCache.swift]
      - SbuHabits/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuHabitsWidget/SbuHabitsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sbu.habits]
    info:
      path: SbuHabitsWidget/Info.plist
      properties:
        CFBundleDisplayName: Sbu Habits
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.habits.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuHabitsWatch:
    type: application
    platform: watchOS
    sources:
      - SbuHabitsWatch
      # The habits' types, the ring and the grid the iPhone sends, as the app draws and counts them.
      - path: SbuHabits/Habits
        excludes: [HabitsModel.swift, HomePages.swift, HabitsModel+Preview.swift, HabitSymbol.swift, HabitSymbol+Catalog.swift, HabitSymbolCategory.swift, SymbolSearch.swift, HabitsExport.swift, HabitsImport.swift, HabitsImport+Failure.swift, HabitsImport+Preview.swift, WidgetChoice.swift, WidgetSlots.swift, HabitInsight.swift, HabitInsightContent.swift, MonthCalendar.swift, CalendarDot.swift, CalendarDotState.swift, WeekdayBar.swift, CompletionHours.swift]
      - path: SbuHabits/Watch
        # The iPhone's side of the link.
        excludes: [Phone]
      - SbuHabits/Reminders/AutomaticReminder.swift
      - SbuHabits/Timer/TimerFormat.swift
      - SbuHabits/Views/HabitRing.swift
      - SbuHabits/Views/HabitRingFace.swift
      - SbuHabits/Views/Widgets/WidgetTrack.swift
    dependencies:
      - package: SbuKit
      - target: SbuHabitsWatchWidget
    entitlements:
      path: SbuHabitsWatch/SbuHabitsWatch.entitlements
      properties:
        # The watch's own App Group, for the complication: not shared with the iPhone, which
        # sends the grid over WatchConnectivity.
        com.apple.security.application-groups: [group.dev.sbu.habits]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.habits.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Habits
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.sbu.habits
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuHabitsWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - SbuHabitsWatchWidget
      - path: SbuHabits/Habits
        excludes: [HabitsModel.swift, HomePages.swift, HabitsModel+Preview.swift, HabitSymbol.swift, HabitSymbol+Catalog.swift, HabitSymbolCategory.swift, SymbolSearch.swift, HabitsExport.swift, HabitsImport.swift, HabitsImport+Failure.swift, HabitsImport+Preview.swift, WidgetChoice.swift, WidgetSlots.swift, HabitInsight.swift, HabitInsightContent.swift, MonthCalendar.swift, CalendarDot.swift, CalendarDotState.swift, WeekdayBar.swift, CompletionHours.swift]
      - path: SbuHabits/Watch
        excludes: [Phone, WatchSessionBridge.swift, WatchEvent.swift]
      - SbuHabits/Reminders/AutomaticReminder.swift
      - SbuHabitsWatch/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuHabitsWatchWidget/SbuHabitsWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sbu.habits]
    info:
      path: SbuHabitsWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Sbu Habits
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.habits.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuHabitsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuHabitsTests]
    dependencies:
      - target: SbuHabits
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuHabitsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuHabitsUITests]
    dependencies:
      - target: SbuHabits
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuHabits:
    build:
      targets:
        SbuHabits: all
    test:
      targets:
        - SbuHabitsTests
        - name: SbuHabitsUITests
          skippedTests: [SnapshotTests]
  SbuHabitsSnapshots:
    build:
      targets:
        SbuHabits: all
    test:
      targets: [SbuHabitsUITests]
  # The Apple Watch app alone, to run it on a watch simulator.
  SbuHabitsWatch:
    build:
      targets:
        SbuHabitsWatch: all
