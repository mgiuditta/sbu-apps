name: SbuLibretto
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuLibretto:
    type: application
    platform: iOS
    sources: [SbuLibretto]
    dependencies:
      - package: SbuKit
      - target: SbuLibrettoWidget
    entitlements:
      path: SbuLibretto/SbuLibretto.entitlements
      properties:
        # Only the widget's snapshot lives here: the libretto stays in the app's own store.
        com.apple.security.application-groups: [group.dev.sbu.libretto]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.libretto
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Libretto
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuLibrettoWidget:
    type: app-extension
    platform: iOS
    sources:
      - SbuLibrettoWidget
      # The widget never opens the store: it reads the snapshot the app writes, with the app's words and formats.
      - path: SbuLibretto/Widget
        includes: [WidgetSnapshot.swift, WidgetSnapshot+Timeline.swift, UserDefaults+AppGroup.swift]
      - path: SbuLibretto/Countdown
        includes: [CountdownDay.swift]
      - path: SbuLibretto/Shared
        includes: [LibrettoFormat.swift]
      - SbuLibretto/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuLibrettoWidget/SbuLibrettoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sbu.libretto]
    info:
      path: SbuLibrettoWidget/Info.plist
      properties:
        CFBundleDisplayName: Sbu Libretto
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.libretto.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  SbuLibrettoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuLibrettoTests]
    dependencies:
      - target: SbuLibretto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuLibrettoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuLibrettoUITests]
    dependencies:
      - target: SbuLibretto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuLibretto:
    build:
      targets:
        SbuLibretto: all
    test:
      targets: [SbuLibrettoTests]
  SbuLibrettoSnapshots:
    build:
      targets:
        SbuLibretto: all
    test:
      targets: [SbuLibrettoUITests]
