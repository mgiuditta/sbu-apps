name: SbuMeds
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuMeds:
    type: application
    platform: iOS
    sources: [SbuMeds]
    dependencies:
      - package: SbuKit
      - target: SbuMedsWidget
    entitlements:
      path: SbuMeds/SbuMeds.entitlements
      properties:
        # The store lives here so the widget can read it.
        com.apple.security.application-groups: [group.dev.sbu.meds]
    info:
      path: SbuMeds/Info.plist
      properties:
        # The version and build from the project settings, as without a plist of our own.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Background App Refresh rolls the 64 pending reminders forward while the app is closed.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.sbu.meds.replan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.meds
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Meds
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Inversa
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuMedsWidget:
    type: app-extension
    platform: iOS
    sources:
      - SbuMedsWidget
      # The widget reads the app's store, so it shares the model and the pure schedule logic.
      - path: SbuMeds/Model
        excludes: [Cabinet.swift, SampleFamily.swift, ModelContainer+Preview.swift]
      - SbuMeds/Schedule
      - SbuMeds/Widget
      - SbuMeds/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuMedsWidget/SbuMedsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sbu.meds]
    info:
      path: SbuMedsWidget/Info.plist
      properties:
        CFBundleDisplayName: Sbu Meds
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.meds.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  SbuMedsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuMedsTests]
    dependencies:
      - target: SbuMeds
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuMedsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuMedsUITests]
    dependencies:
      - target: SbuMeds
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuMeds:
    build:
      targets:
        SbuMeds: all
    test:
      targets: [SbuMedsTests]
  SbuMedsSnapshots:
    build:
      targets:
        SbuMeds: all
    test:
      targets: [SbuMedsUITests]
