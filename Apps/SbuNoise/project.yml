name: SbuNoise
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuNoise:
    type: application
    platform: iOS
    sources: [SbuNoise]
    dependencies:
      - package: SbuKit
      - target: SbuNoiseWidget
    entitlements:
      path: SbuNoise/SbuNoise.entitlements
      properties:
        # The Noise file and what is playing, shared with the widgets and the control.
        com.apple.security.application-groups: [group.dev.sbu.noise]
    info:
      path: SbuNoise/Info.plist
      properties:
        # Keeps the sound playing with the screen locked and in the background.
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.noise
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Noise
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuNoiseWidget:
    type: app-extension
    platform: iOS
    sources:
      - SbuNoiseWidget
      # What is playing and the play/pause intent, which runs in the app.
      - SbuNoise/Shared
      - SbuNoise/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuNoiseWidget/SbuNoiseWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sbu.noise]
    info:
      path: SbuNoiseWidget/Info.plist
      properties:
        CFBundleDisplayName: Sbu Noise
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.noise.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuNoiseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuNoiseTests]
    dependencies:
      - target: SbuNoise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuNoiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuNoiseUITests]
    dependencies:
      - target: SbuNoise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuNoise:
    build:
      targets:
        SbuNoise: all
    test:
      targets: [SbuNoiseTests]
  SbuNoiseSnapshots:
    build:
      targets:
        SbuNoise: all
    test:
      targets: [SbuNoiseUITests]
schemes:
  SbuNoise:
    build:
      targets:
        SbuNoise: all
    test:
      targets:
        - SbuNoiseTests
        - name: SbuNoiseUITests
          skippedTests: [SnapshotTests]
  SbuNoiseSnapshots:
    build:
      targets:
        SbuNoise: all
    test:
      targets: [SbuNoiseUITests]
