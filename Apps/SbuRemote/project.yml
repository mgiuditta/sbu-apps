name: SbuRemote
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuRemote:
    type: application
    platform: iOS
    sources: [SbuRemote]
    dependencies:
      - package: SbuKit
      - target: SbuRemoteWidget
    entitlements:
      path: SbuRemote/SbuRemote.entitlements
      properties:
        # Saved TVs live here so the widget shows the TV its buttons go to.
        com.apple.security.application-groups: [group.dev.sbu.remote]
    info:
      path: SbuRemote/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Bonjour types the discovery browses: Android TV Remote v2, and AirPlay, which Samsung,
        # LG and Sony TVs since 2018 announce, so their address is found without SSDP.
        NSBonjourServices: [_androidtvremote2._tcp, _airplay._tcp]
        # TVs speak plain HTTP on the local network (Sony REST, Samsung /api/v2/).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.remote
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Inversa
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Remote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # ADR-0007: the app talks only to the user's TV on the home Wi-Fi. English in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Sbu Remote cerca la tua TV sulla Wi-Fi e le manda i tasti che premi. Nulla esce dalla rete di casa."
        # Voice search, recognized on the iPhone only (#337).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Il microfono ascolta la ricerca che detti alla TV. L'audio resta sull'iPhone."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Le parole che detti diventano testo sull'iPhone, senza internet, e vanno alla casella di ricerca della TV."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuRemoteWidget:
    type: app-extension
    platform: iOS
    sources:
      - SbuRemoteWidget
      # The widget's buttons run the app's intents, so it compiles them and what they use.
      # They run in the app's process, which holds the credentials and the Local Network permission.
      - SbuRemote/Model
      - SbuRemote/Security
      - SbuRemote/Connection
      - SbuRemote/Protocols
      - SbuRemote/Power
      - path: SbuRemote/Intents
        excludes: [RemoteShortcuts.swift]
      - path: SbuRemote/Discovery
        includes: [NetworkFeatures.swift, LocalNetworkAccess.swift]
      - path: SbuRemote/Remote
        includes: [HoldStrategy.swift]
      - SbuRemote/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuRemoteWidget/SbuRemoteWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sbu.remote]
    info:
      path: SbuRemoteWidget/Info.plist
      properties:
        CFBundleDisplayName: Sbu Remote
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.remote.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  SbuRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuRemoteTests]
    dependencies:
      - target: SbuRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuRemoteUITests]
    dependencies:
      - target: SbuRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuRemote:
    build:
      targets:
        SbuRemote: all
    test:
      targets: [SbuRemoteTests]
  SbuRemoteSnapshots:
    build:
      targets:
        SbuRemote: all
    test:
      targets: [SbuRemoteUITests]
