name: SbuRemote
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuRemote:
    type: application
    platform: iOS
    sources: [SbuRemote]
    dependencies:
      - package: SbuKit
    info:
      path: SbuRemote/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Bonjour types the discovery browses: Android TV Remote v2, and AirPlay, which Samsung,
        # LG and Sony TVs since 2018 announce, so their address is found without SSDP.
        NSBonjourServices: [_androidtvremote2._tcp, _airplay._tcp]
        # TVs speak plain HTTP on the local network (Sony REST, Samsung /api/v2/).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.remote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Remote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # ADR-0007: the app talks only to the user's TV on the home Wi-Fi. English in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Sbu Remote cerca la tua TV sulla Wi-Fi e le manda i tasti che premi. Nulla esce dalla rete di casa."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuRemoteTests]
    dependencies:
      - target: SbuRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuRemoteUITests]
    dependencies:
      - target: SbuRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuRemote:
    build:
      targets:
        SbuRemote: all
    test:
      targets: [SbuRemoteTests]
  SbuRemoteSnapshots:
    build:
      targets:
        SbuRemote: all
    test:
      targets: [SbuRemoteUITests]
