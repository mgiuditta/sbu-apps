name: SbuScanner
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuScanner:
    type: application
    platform: iOS
    sources: [SbuScanner]
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuScanner/SbuScanner.entitlements
      properties:
        # "Connetti" on a Wi-Fi code joins the network, after iOS asks the user.
        com.apple.developer.networking.HotspotConfiguration: true
    info:
      path: SbuScanner/Info.plist
      properties:
        # English in InfoPlist.xcstrings.
        NSCameraUsageDescription: "Sbu Scanner usa la fotocamera per leggere QR e codici a barre. Le immagini restano sull'iPhone."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.barcodescanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Scanner
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuScannerTests]
    dependencies:
      - target: SbuScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuScannerUITests]
    dependencies:
      - target: SbuScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuScanner:
    build:
      targets:
        SbuScanner: all
    test:
      targets: [SbuScannerTests]
  SbuScannerSnapshots:
    build:
      targets:
        SbuScanner: all
    test:
      targets: [SbuScannerUITests]
