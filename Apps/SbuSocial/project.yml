name: SbuSocial
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuSocial:
    type: application
    platform: iOS
    sources: [SbuSocial, Shared]
    dependencies:
      - package: SbuKit
      - target: SbuSocialShieldConfiguration
      - target: SbuSocialShieldAction
      - target: SbuSocialMonitor
      - target: SbuSocialWidget
    info:
      path: SbuSocial/Info.plist
      properties:
        # YouTube keeps playing when you leave the app, as in SocialLite.
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: SbuSocial/SbuSocial.entitlements
      properties:
        # Screen Time with individual authorization: the Shield, Modalità post, Sonno and the Limite di tempo.
        com.apple.developer.family-controls: true
        # The app and its Screen Time extensions share the chosen apps and the schedules here.
        com.apple.security.application-groups: [group.dev.sbu.social]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.social
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Social
        # Modalità post's countdown on the Lock Screen and in the Dynamic Island.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Inversa
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuSocialShieldConfiguration:
    # Draws the Shield over a native app.
    type: app-extension
    platform: iOS
    sources:
      - SbuSocialShieldConfiguration
      # The Shield's words come from the app's catalog.
      - SbuSocial/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuSocialShieldConfiguration/SbuSocialShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.dev.sbu.social]
    info:
      path: SbuSocialShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Sbu Social
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.social.shieldconfiguration
        TARGETED_DEVICE_FAMILY: "1"
  SbuSocialShieldAction:
    # Handles the Shield's buttons.
    type: app-extension
    platform: iOS
    sources:
      - SbuSocialShieldAction
      # The Shield's words come from the app's catalog.
      - SbuSocial/Localizable.xcstrings
    entitlements:
      path: SbuSocialShieldAction/SbuSocialShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.dev.sbu.social]
    info:
      path: SbuSocialShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Sbu Social
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.social.shieldaction
        TARGETED_DEVICE_FAMILY: "1"
  SbuSocialMonitor:
    # Runs when a Screen Time schedule starts or ends.
    type: app-extension
    platform: iOS
    sources: [SbuSocialMonitor, Shared]
    entitlements:
      path: SbuSocialMonitor/SbuSocialMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.dev.sbu.social]
    info:
      path: SbuSocialMonitor/Info.plist
      properties:
        CFBundleDisplayName: Sbu Social
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.social.deviceactivitymonitor
        TARGETED_DEVICE_FAMILY: "1"
  SbuSocialWidget:
    # Modalità post's Live Activity; the widget comes later.
    type: app-extension
    platform: iOS
    sources:
      - SbuSocialWidget
      - Shared/PostModeAttributes.swift
      - SbuSocial/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    info:
      path: SbuSocialWidget/Info.plist
      properties:
        CFBundleDisplayName: Sbu Social
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.social.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuSocialTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuSocialTests]
    dependencies:
      - target: SbuSocial
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuSocialUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuSocialUITests]
    dependencies:
      - target: SbuSocial
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuSocial:
    build:
      targets:
        SbuSocial: all
    test:
      targets: [SbuSocialTests]
  SbuSocialSnapshots:
    build:
      targets:
        SbuSocial: all
    test:
      targets: [SbuSocialUITests]
