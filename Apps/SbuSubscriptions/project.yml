name: SbuSubscriptions
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuSubscriptions:
    type: application
    platform: iOS
    sources: [SbuSubscriptions]
    dependencies:
      - package: SbuKit
      - target: SbuSubscriptionsWidget
    entitlements:
      path: SbuSubscriptions/SbuSubscriptions.entitlements
      properties:
        # The store lives here so the widget can read it.
        com.apple.security.application-groups: [group.dev.sbu.subscriptions]
        # Sincronizza con iCloud, off by default: the store mirrored to the user's own private
        # CloudKit database (ADR-0008). App only; the widget reads the local store.
        com.apple.developer.icloud-container-identifiers: [iCloud.dev.sbu.subscriptions]
        com.apple.developer.icloud-services: [CloudKit]
        # The silent notification iCloud sends when another device changed the store; no server of ours.
        aps-environment: development
    info:
      path: SbuSubscriptions/Info.plist
      properties:
        # The version and build from the project settings, as without a plist of our own.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Wakes the app for iCloud's silent notification, to bring in changes from your other devices.
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.subscriptions
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Subscriptions
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuSubscriptionsWidget:
    type: app-extension
    platform: iOS
    sources:
      - SbuSubscriptionsWidget
      # The widget reads the app's store, so it shares the model, the money and the schedule types.
      - path: SbuSubscriptions/Subscriptions
        excludes: [Subscription+Demo.swift]
      - path: SbuSubscriptions/Categories
        includes: [BuiltInCategory.swift, SubscriptionCategory.swift, SubscriptionList.swift]
      - path: SbuSubscriptions/History
        includes: [PriceChange.swift, SubscriptionEvent.swift, PriceTimeline.swift]
      - path: SbuSubscriptions/Currency
        includes: [CurrencySettings.swift, CurrencyConverter.swift, ExchangeRates.swift, ExchangeRates.json, OwnRate.swift]
      - path: SbuSubscriptions/Totals
        includes: [Charge.swift, SpendingTotal.swift, TotalPeriod.swift]
      - path: SbuSubscriptions/Reminders
        includes: [ReminderSource.swift]
      - path: SbuSubscriptions/Calendar
        includes: [MonthGrid.swift, MonthPayments.swift]
      - path: SbuSubscriptions/Home
        includes: [DueDay.swift, UpcomingPayments.swift]
      - SbuSubscriptions/Intents
      - SbuSubscriptions/UserDefaults+AppGroup.swift
      - SbuSubscriptions/Localizable.xcstrings
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuSubscriptionsWidget/SbuSubscriptionsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sbu.subscriptions]
    info:
      path: SbuSubscriptionsWidget/Info.plist
      properties:
        CFBundleDisplayName: Sbu Subscriptions
        # The same version and build as the app, from the project settings, as App Store Connect requires.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.subscriptions.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  SbuSubscriptionsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuSubscriptionsTests]
    dependencies:
      - target: SbuSubscriptions
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuSubscriptionsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuSubscriptionsUITests]
    dependencies:
      - target: SbuSubscriptions
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuSubscriptions:
    build:
      targets:
        SbuSubscriptions: all
    test:
      targets: [SbuSubscriptionsTests]
  SbuSubscriptionsSnapshots:
    build:
      targets:
        SbuSubscriptions: all
    test:
      targets: [SbuSubscriptionsUITests]
