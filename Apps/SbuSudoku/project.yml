name: SbuSudoku
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuSudoku:
    type: application
    platform: iOS
    sources: [SbuSudoku]
    dependencies:
      - package: SbuKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.sudoku
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Sudoku
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuSudokuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuSudokuTests]
    dependencies:
      - target: SbuSudoku
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuSudokuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuSudokuUITests]
    dependencies:
      - target: SbuSudoku
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuSudoku:
    build:
      targets:
        SbuSudoku: all
    test:
      targets: [SbuSudokuTests]
  SbuSudokuSnapshots:
    build:
      targets:
        SbuSudoku: all
    test:
      targets: [SbuSudokuUITests]
