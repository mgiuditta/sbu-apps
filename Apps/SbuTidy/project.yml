name: SbuTidy
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    # iPhone and iPad: Tody runs on both, and two of its reviews ask for iPad in landscape.
    TARGETED_DEVICE_FAMILY: "1,2"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SbuTidy:
    type: application
    platform: iOS
    sources: [SbuTidy]
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuTidy/SbuTidy.entitlements
      properties:
        # The store lives here so the widget can read it.
        com.apple.security.application-groups: [group.dev.sbu.tidy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.tidy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Tidy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuTidyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuTidyTests]
    dependencies:
      - target: SbuTidy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SbuTidyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuTidyUITests]
    dependencies:
      - target: SbuTidy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  SbuTidy:
    build:
      targets:
        SbuTidy: all
    test:
      targets: [SbuTidyTests]
  SbuTidySnapshots:
    build:
      targets:
        SbuTidy: all
    test:
      targets: [SbuTidyUITests]
