server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # trailingSlash 'never': /apps/habits/ goes to /apps/habits instead of a 404.
    rewrite ^/(.+)/$ /$1 permanent;

    # build.format 'file': /privacy is served from privacy.html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/headers.inc;
    }

    # Font names carry no hash, so a month rather than immutable.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        include /etc/nginx/conf.d/headers.inc;
    }

    error_page 404 /404.html;
    include /etc/nginx/conf.d/headers.inc;
}
