<!doctype html>
<!-- App Store screenshots: 2-5 slides of 1320×2868, each composed on its own (layout per slide in
     the app's fastlane/screenshots/scenes.json): an engraving drawn for that slide, the real screen,
     and an ink mark on one real value. Driven by Tools/make_screenshots.py, which passes the app as
     JSON in the hash and a slice index (one PNG per slice). Without a slice it shows every slide side
     by side, for review. One full stop on the last title. Quaderno (v5): paper with
     the notebook grid at 3x (one cell = 3 × grid-cell), a vertical line on the titles' margin, titles in
     Bricolage variable at 800 and width 87, the full stop exactly one cell, a Plex Mono cartiglio. -->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Screenshot store</title>
<style>
  @font-face {
    font-family: "Bricolage Grotesque";
    src: url("../../Design/fonts/BricolageGrotesque-Variable.ttf") format("truetype");
    font-weight: 200 800;
    font-stretch: 75% 100%;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("../../Design/fonts/IBMPlexMono-Medium.ttf") format("truetype");
    font-weight: 500;
  }
  /* Store screenshots are light only; values from Design/tokens.json (light), passed in. */
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: var(--sunken); }
  body.preview { overflow: auto; padding: 24px 16px; }
  .row { display: flex; gap: 14px; justify-content: center; }
  .slice { width: 1320px; height: 2868px; position: relative; overflow: hidden; flex: none; }
  .preview .slice { border-radius: 12px; }
  .page { position: absolute; inset: 0; background: var(--paper); }
  /* The grid: `grid` ink through a one-cell mask (the site's own Site/public/grid-cell.svg), a vertical
     line every cell from the grid offset, so the titles' margin falls on one. No gradient. */
  .page::before { content: ""; position: absolute; inset: 0; background: var(--grid);
    -webkit-mask: url("../../Site/public/grid-cell.svg") var(--grid-offset) 0 / var(--grid-cell) var(--grid-cell) repeat;
    mask: url("../../Site/public/grid-cell.svg") var(--grid-offset) 0 / var(--grid-cell) var(--grid-cell) repeat; }

  /* Titles: two cells a line, from the third row; the cartiglio sits on the row above. */
  .t { position: absolute; top: calc(var(--grid-cell) * 3); width: 1080px; margin: 0; color: var(--ink);
    font: 800 calc(var(--grid-cell) * 2) / calc(var(--grid-cell) * 2) "Bricolage Grotesque", sans-serif;
    font-stretch: var(--title-stretch); text-wrap: balance; }
  .c { position: absolute; top: calc(var(--grid-cell) * 2); margin: 0; color: var(--ink-muted);
    font: 500 var(--cartiglio-size) / var(--grid-cell) "IBM Plex Mono", monospace;
    letter-spacing: var(--cartiglio-tracking); text-transform: uppercase; }
  .t small { display: block; margin-top: 28px; color: var(--ink-muted); letter-spacing: 0;
    font: 500 54px/1.25 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .stop { display: inline-block; width: var(--full-stop-hero); height: var(--full-stop-hero);
    margin-inline-start: var(--mark-gap); background: var(--accent); }

  /* The real iPhone 17 Pro Max bezel (Apple Design Resources, via fastlane frameit): 1470×3000,
     screen hole 1320×2868 at 75,66. The screenshot sits in the hole, the bezel image on top. Phones
     always stand straight (#582: tilted, the app read stretched and small); slides differ by scale,
     position and crop. */
  .phone { position: absolute; filter: drop-shadow(var(--shadow)); }
  .phone img { position: absolute; display: block; }
  .phone .screen { left: 5.102%; top: 2.2%; width: 89.796%; height: 95.6%; border-radius: 8% / 3.7%; }
  .phone .bezel { inset: 0; width: 100%; height: 100%; }

  /* The engraving mask is white ink: brightness(0) turns it to ink. A CSS mask on a 2200px ink
     square left whole black tiles when headless Chrome painted before applying it. */
  .engraving { position: absolute; object-fit: contain; filter: brightness(0); opacity: .9; }

  /* The ink mark on a real value: an SVG in the screenshot's own pixels, over the screen. */
  .ink { position: absolute; overflow: visible; fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
  .phone .ink { left: 5.102%; top: 2.2%; width: 89.796%; height: 95.6%; }

  /* Detail: one region of the screen enlarged on a card (radius-card and the line border, at 3x). */
  .zoom { position: absolute; overflow: hidden; background: var(--surface-raised); border: 3px solid var(--line);
    border-radius: 18px; filter: drop-shadow(var(--shadow)); }
  .zoom img, .zoom svg { position: absolute; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  const W = 1320, H = 2868;
  const app = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  const slice = new URLSearchParams(location.search).get("slice");
  const n = app.shots.length; // 2...5
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries(app.tokens)) root.setProperty(`--${k}`, v);

  // Each layout: where the phone stands (x, top, width) and the engraving (x, top, side).
  // Phones may run off the slide: the screen shows what the title talks about, not the whole phone.
  const LAYOUTS = {
    hero:   { phone: { x: 420, top: 1040, w: 1000 }, engraving: { x: -700, top: 1100, w: 1700 } },
    left:   { phone: { x: 100, top: 980, w: 940 },   engraving: { x: 640, top: 1500, w: 1100 } },
    right:  { phone: { x: 300, top: 980, w: 940 },   engraving: { x: -420, top: 1500, w: 1100 } },
    detail: { phone: { x: 60, top: 1380, w: 760 },   engraving: { x: 640, top: 1800, w: 1100 },
              zoom: { x: 300, top: 960, w: 940 } },
    flat:   { phone: { x: 120, top: 1060, w: 860 },  engraving: { x: 620, top: 1700, w: 1000 } },
  };

  const BEZEL = "../../Design/devices/iphone-17-pro-max-silver.png";

  // A hand-drawn ink mark in screenshot pixels: a loop that overshoots its start, or a double underline.
  function inkPath(mark) {
    const [x0, y0, x1, y1] = mark.box;
    if (mark.shape === "underline") {
      const y = y1, d = (x1 - x0) / 2;
      return `M${x0} ${y} Q${x0 + d} ${y + 16} ${x1} ${y - 8} M${x0 + 30} ${y + 26} Q${x0 + d} ${y + 40} ${x1 - 40} ${y + 20}`;
    }
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = (x1 - x0) / 2, ry = (y1 - y0) / 2;
    const pts = [];
    for (let t = -0.4; t <= Math.PI * 2 + 0.5; t += 0.08) {
      const wobble = 1 + 0.035 * Math.sin(3 * t + 1) + 0.03 * t / Math.PI;
      pts.push(`${(cx + rx * wobble * Math.cos(t)).toFixed(1)} ${(cy + ry * wobble * Math.sin(t)).toFixed(1)}`);
    }
    return `M${pts.join(" L")}`;
  }
  const ink = (mark, style = "") => mark
    ? `<svg class="ink" viewBox="0 0 ${W} ${H}" style="${style}"><path d="${inkPath(mark)}" stroke-width="9"/></svg>` : "";

  function phone(s, p) {
    return `<div class="phone" style="left:${p.x}px;top:${p.top}px;width:${p.w}px;height:${p.w * 3000 / 1470}px">
      <img class="screen" src="${s.image}" alt="">${ink(s.mark)}<img class="bezel" src="${BEZEL}" alt=""></div>`;
  }

  // The zoom card shows s.zoom = [x0, y0, x1, y1] of the screenshot at the card's width, mark included.
  function zoom(s, z) {
    const [x0, y0, x1, y1] = s.zoom, k = z.w / (x1 - x0);
    const place = `left:${-x0 * k}px;top:${-y0 * k}px;width:${W * k}px;height:${H * k}px`;
    return `<div class="zoom" style="left:${z.x}px;top:${z.top}px;width:${z.w}px;height:${(y1 - y0) * k}px">
      <img src="${s.image}" alt="" style="${place}">${ink(s.mark, place)}</div>`;
  }

  const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
  const cell = parseFloat(app.tokens["grid-cell"]), offset = parseFloat(app.tokens["grid-offset"]);
  const margin = offset + cell * Math.ceil((120 - offset) / cell); // first vertical line past 120px

  function slide(s, i) {
    const L = LAYOUTS[s.layout] ?? LAYOUTS.flat, e = L.engraving;
    const zoomed = L.zoom && s.zoom;
    return `<div class="page">
      <img class="engraving" src="${s.engraving}" alt="" style="left:${e.x}px;top:${e.top}px;width:${e.w}px;height:${e.w}px">
      ${i === 0 ? `<p class="c" style="left:${margin}px">${esc(app.cartiglio)}</p>` : ""}
      <p class="t" style="left:${margin}px">${esc(s.title)}${i === n - 1 ? '<span class="stop"></span>' : ""}${s.subtitle ? `<small>${esc(s.subtitle)}</small>` : ""}</p>
      ${phone(zoomed ? { ...s, mark: null } : s, L.phone)}
      ${zoomed ? zoom(s, L.zoom) : ""}</div>`;
  }

  const indices = slice === null ? [...Array(n).keys()] : [Number(slice)];
  document.getElementById("row").innerHTML = indices.map(i => `<div class="slice">${slide(app.shots[i], i)}</div>`).join("");
  if (slice === null) {
    document.body.classList.add("preview");
    const fit = Math.min(0.25, (innerWidth - 32 - n * 14) / (n * W));
    for (const s of document.querySelectorAll(".slice")) s.style.zoom = fit;
  }
</script>
</body>
</html>
