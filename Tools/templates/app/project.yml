name: Sbu__NAME__
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Sbu__NAME__:
    type: application
    platform: iOS
    sources: [Sbu__NAME__]
    dependencies:
      - package: SbuKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.__LOWER__
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu __NAME__
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  Sbu__NAME__Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Sbu__NAME__Tests]
    dependencies:
      - target: Sbu__NAME__
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  Sbu__NAME__UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Sbu__NAME__UITests]
    dependencies:
      - target: Sbu__NAME__
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # SnapshotHelper.swift comes from fastlane and predates Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
schemes:
  Sbu__NAME__:
    build:
      targets:
        Sbu__NAME__: all
    test:
      targets: [Sbu__NAME__Tests]
  Sbu__NAME__Snapshots:
    build:
      targets:
        Sbu__NAME__: all
    test:
      targets: [Sbu__NAME__UITests]
